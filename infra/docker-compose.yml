services:
  postgres:
    image: postgres:16-alpine
    container_name: gmail-manager-postgres
    environment:
      POSTGRES_DB: gmail_manager
      POSTGRES_USER: gmail_manager
      POSTGRES_PASSWORD: gmail_manager_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmail_manager -d gmail_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
